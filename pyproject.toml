[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opti-med"
version = "0.1.0"
description = "Minimal structured-data foundations for the OPTI-MED MVP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1.0",
  "pandas>=2.1,<3.0",
  "pyarrow>=15,<22",
  "uvicorn>=0.29,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
